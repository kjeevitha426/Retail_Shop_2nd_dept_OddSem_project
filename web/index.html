<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Store Inventory & Sales Analysis System</title>
    <script>
        // Automatic router: checks if user is logged in
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('retail_user');
            if (user) {
                window.location.replace('dashboard.html');
            } else {
                window.location.replace('login.html');
            }
        });
    </script>
</head>
<body style="background-color: #090d16; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2 style="font-weight: 500;">Retail Store Inventory & Sales Analysis System</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Initializing application...</p>
    </div>
</body>
</html>
